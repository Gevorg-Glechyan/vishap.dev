<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PageHero — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
html,body{margin:0}body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}img{display:block}.light-only{display:block}.dark-only{display:none}[data-theme="dark"] .light-only{display:none}[data-theme="dark"] .dark-only{display:block}
.page{--accent:var(--product-violet);padding:0 var(--space-12) var(--space-12);display:grid;grid-template-columns:1fr 280px;gap:var(--space-12);align-items:end}
nav{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;height:64px;font-size:14px;color:var(--ink-muted)}
.icon{margin-top:var(--space-6)}
h1{margin:var(--space-6) 0 0;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.lead{margin:var(--space-3) 0 0;font-size:20px;line-height:1.5;color:var(--ink-muted);max-width:52ch}
.actions{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-6)}
.btn{display:inline-flex;align-items:center;height:40px;padding:0 var(--space-4);border:1px solid var(--accent);border-radius:var(--radius-md);background:var(--accent);color:var(--on-product);font-size:14px;font-weight:600}
.btn.secondary{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.meta{margin:var(--space-4) 0 0;font-family:var(--font-mono);font-size:13px;line-height:1.5;font-weight:500;color:var(--ink-subtle)}
.pic{width:280px;height:280px;border-radius:var(--radius-md)}
</style>
</head>
<body>
<div class="page">
<nav><img class="light-only" src="/_blob/f289fd6f01bba036fc949f9d0e891711" height="22" alt="vishap"><img class="dark-only" src="/_blob/5465fb1bab0e1e3d303bc79d0fba0212" height="22" alt="vishap"><span>All tools</span></nav>
<div>
<img class="icon" src="/_blob/58ea6d7933a38c5f3b192178c59a3cc3" width="64" height="64" alt="">
<h1>Window Resize Manager</h1>
<p class="lead">Sets any window to an exact size.</p>
<div class="actions"><span class="btn">Add to Chrome</span><span class="btn secondary">See what it does</span></div>
<p class="meta">1280 × 800 · Chrome extension · by vishap</p>
</div>
<img class="pic" src="/_blob/83b945ab68bd84eea59ef84e3d17aed4" alt="">
</div>
</body>
</html>
